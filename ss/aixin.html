<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我爱你</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #ffebee;
        overflow: hidden;
        font-family: "Arial", sans-serif;
      }

      .container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 10;
      }

      h1 {
        color: #e91e63;
        font-size: 3em;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        animation: pulse 1.5s infinite;
      }

      p {
        color: #880e4f;
        font-size: 1.5em;
        margin-top: 20px;
      }

      .heart {
        position: absolute;
        pointer-events: none;
        animation: float 6s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-20px) rotate(10deg);
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      button {
        background-color: #e91e63;
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 1.2em;
        border-radius: 50px;
        cursor: pointer;
        margin-top: 30px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        transition: all 0.3s;
      }

      button:hover {
        background-color: #c2185b;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>❤️ 我爱你 ❤️</h1>
      <p>遇见你是我今生最大的幸运</p>
      <p>愿与你携手共度余生</p>
      <button id="moreHearts">点击更多爱心</button>
    </div>

    <script>
      // 创建爱心元素
      function createHeart() {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.top = Math.random() * 100 + "vh";
        heart.style.fontSize = Math.random() * 20 + 10 + "px";
        heart.style.opacity = Math.random() * 0.5 + 0.5;
        heart.style.animationDuration = Math.random() * 3 + 3 + "s";

        document.body.appendChild(heart);

        // 移除爱心元素以避免内存泄漏
        setTimeout(() => {
          heart.remove();
        }, 6000);
      }

      // 初始创建一些爱心
      for (let i = 0; i < 20; i++) {
        setTimeout(createHeart, i * 300);
      }

      // 点击按钮创建更多爱心
      document.getElementById("moreHearts").addEventListener("click", () => {
        for (let i = 0; i < 30; i++) {
          setTimeout(createHeart, i * 100);
        }

        // 显示隐藏消息
        const message = document.createElement("div");
        message.innerHTML = "我爱你！";
        message.style.position = "fixed";
        message.style.top = "50%";
        message.style.left = "50%";
        message.style.transform = "translate(-50%, -50%)";
        message.style.fontSize = "5em";
        message.style.color = "#e91e63";
        message.style.zIndex = "100";
        message.style.animation = "pulse 0.5s";
        document.body.appendChild(message);

        setTimeout(() => {
          message.remove();
        }, 1000);
      });

      // 鼠标移动时创建爱心
      document.addEventListener("mousemove", (e) => {
        if (Math.random() > 0.7) {
          const heart = document.createElement("div");
          heart.className = "heart";
          heart.innerHTML = "❤️";
          heart.style.left = e.clientX + "px";
          heart.style.top = e.clientY + "px";
          heart.style.fontSize = Math.random() * 10 + 5 + "px";
          heart.style.opacity = Math.random() * 0.5 + 0.5;
          heart.style.animationDuration = Math.random() * 2 + 2 + "s";

          document.body.appendChild(heart);

          setTimeout(() => {
            heart.remove();
          }, 3000);
        }
      });
    </script>
  </body>
</html>
